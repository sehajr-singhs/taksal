<div class="reader" data-reader="hukamnama" data-source="G" data-source-name="Sri Guru Granth Sahib Ji">
  <div class="reader-bar">
    <div class="style-toggles">
      <div class="seg" role="group" aria-label="Gurmukhi style">
        <button type="button" data-mode="padchhed" aria-pressed="true">Padchhed</button>
        <button type="button" data-mode="larivaar" aria-pressed="false">Larivaar</button>
      </div>
      <label class="toggle"><input type="checkbox" data-toggle="english"> English</label>
      <label class="toggle"><input type="checkbox" data-toggle="translit"> Transliteration</label>
    </div>
  </div>

  @@PERSPECTIVES@@
  <div data-notice></div>
  <div class="reader-status" data-status role="status" aria-live="polite"></div>
  <div class="reader-head" data-reader-head></div>
  <div class="reader-lines" data-lines></div>
</div>
